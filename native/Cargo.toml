[package]
name = "traffic-etw"
version = "0.1.0"
edition = "2024"

[dependencies]
ferrisetw = "1.2.0"
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
